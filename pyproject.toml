[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-equity-explorer"
version = "0.1.0"
description = "A local-first classical ML study of Phoenix summer land-surface temperature."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "pyarrow>=15.0",
    "pyproj>=3.6",
    "rasterio>=1.3.9",
    "scikit-learn>=1.4",
    "shapely>=2.0",
    "streamlit>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
heat-equity = "heat_equity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"